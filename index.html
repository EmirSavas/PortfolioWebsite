<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emir Savaş | Product Manager and Game Designer</title>
  <meta name="description" content="Portfolio of Emir Savaş, a product manager and game designer working on casual and hybrid-casual mobile games.">
  <meta name="theme-color" content="#0a0e1f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e1f'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' text-anchor='middle' fill='%2333dbf0'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <a class="skip" href="#about" id="skip-link">Skip to content</a>

  <header class="topbar" id="topbar">
    <a class="brand" href="#top" id="brand">
      <svg class="brand-mark" viewBox="0 0 32 24" width="30" height="22" aria-hidden="true"><path d="M9 4h14a7 7 0 0 1 6.7 5l1.2 4.6A5 5 0 0 1 26 20c-1.6 0-2.7-.9-3.8-2.2L21 16.5H11l-1.2 1.3C8.700 19.100 7.600 20 6 20a5 5 0 0 1-4.900-6.400L2.300 9A7 7 0 0 1 9 4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 9v5M6.500 11.500h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="21.500" cy="9.800" r="1.200" fill="currentColor"/><circle cx="24.500" cy="12.800" r="1.200" fill="currentColor"/></svg>
      <span id="brand-name"></span>
    </a>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="sr-only" id="nav-toggle-label">Menu</span>
    </button>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main>
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="hero-bg" aria-hidden="true">
        <span class="glow glow-purple"></span>
        <span class="glow glow-cyan"></span>
        <span class="dots"></span>
      </div>
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <p class="hero-label" id="hero-label"></p>
          <h1 id="hero-title"></h1>
          <p class="hero-text" id="hero-text"></p>
          <div class="btn-row" id="hero-actions"></div>
        </div>
        <div class="hero-art" id="hero-art" aria-hidden="true"></div>
      </div>
      <div class="wrap">
        <ul class="expertise" id="expertise"></ul>
      </div>
    </section>

    <section class="wrap section" id="about" aria-labelledby="about-h">
      <h2 id="about-h"></h2>
      <div class="about-grid">
        <div class="prose" id="about-text"></div>
        <dl class="facts" id="about-facts"></dl>
      </div>
    </section>

    <section class="wrap section journey-section" id="experience" aria-labelledby="exp-h">
      <header class="sec-head">
        <p class="eyebrow" id="exp-eyebrow"></p>
        <h2 id="exp-h"></h2>
        <p class="sec-sub" id="exp-sub"></p>
        <svg class="route" viewBox="0 0 260 90" aria-hidden="true"><path d="M4 70c26-4 40 8 66-4s34-30 62-34 38 14 64 6 36-34 52-38"/><circle cx="70" cy="66" r="5"/><circle cx="196" cy="40" r="6"/><path class="flag" d="M242 6v26M242 6l16 6-16 7"/></svg>
      </header>
      <div class="exp-layout">
        <ol class="journey" id="journey"></ol>
        <aside class="core" aria-labelledby="core-h">
          <h3 id="core-h"></h3>
          <ul class="core-list" id="core-list"></ul>
        </aside>
      </div>
    </section>

    <section class="section projects" id="projects" aria-labelledby="proj-h">
      <div class="wrap">
        <header class="sec-head">
          <p class="eyebrow" id="proj-eyebrow"></p>
          <h2 id="proj-h"></h2>
          <p class="sec-sub" id="proj-intro"></p>
        </header>
      </div>
      <div class="wrap">
        <ul class="pbanners" id="banners"></ul>
      </div>
    </section>

    <section class="wrap section" id="cv" aria-labelledby="cv-h">
      <h2 id="cv-h"></h2>
      <div class="cv-block">
        <div>
          <p id="cv-text"></p>
          <div class="btn-row">
            <button type="button" class="btn btn-primary" id="cv-open"></button>
            <a class="btn" id="cv-download" download></a>
          </div>
        </div>
        <button type="button" class="cv-preview" id="cv-preview" aria-label="Read the CV"></button>
      </div>
    </section>
  </main>

  <footer class="wrap section contact" id="contact" aria-labelledby="contact-h">
    <h2 id="contact-h"></h2>
    <p class="section-intro" id="contact-text"></p>
    <p class="btn-row" id="contact-links"></p>
    <p class="copyright" id="copyright"></p>
  </footer>

  <dialog id="cv-dialog" aria-label="CV">
    <div class="dlg-bar">
      <a class="btn btn-primary" id="cvd-download" download></a>
      <button type="button" class="dlg-close dlg-close-inline" id="cvd-close"></button>
    </div>
    <div class="cv-pages" id="cv-pages"></div>
  </dialog>

  <script src="content.js?v=4"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
